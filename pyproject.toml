[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "DTZ",  # naive datetime usage
]

[tool.ruff.lint.per-file-ignores]
# These tests construct naive datetimes on purpose: a naive wall-clock time is
# exactly the input to_utc() exists to convert, so it is the thing under test.
"tests/test_time_handling.py" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Our own deprecations are bugs; fail on them.
    "error::DeprecationWarning:app.*",
    # Legacy SQLAlchemy 1.x APIs are gone from this codebase; keep them gone.
    "error::sqlalchemy.exc.LegacyAPIWarning",
]
markers = [
    "slow: tests that take more than a second",
]
