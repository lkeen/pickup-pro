{% extends "base.html" %}
{% block body %}
<div class="container">
  <h1>Welcome, {{ username }}!</h1>

  <nav>
    <h2>Navigation</h2>
    <ul>
      <li><a href="{{ url_for('profiles.detail', user_id=current_user.id) }}">My Profile & Stats</a></li>
      <li><a href="{{ url_for('courts.index') }}">View Courts</a></li>
      <li><a href="{{ url_for('courts.create') }}">Create New Court</a></li>
      <li><a href="{{ url_for('games.index') }}">View Games</a></li>
      <li><a href="{{ url_for('games.create') }}">Create New Game</a></li>
    </ul>
  </nav>

  <form method="POST" action="{{ url_for('auth.logout') }}">
    {{ logout_form.hidden_tag() }}
    <button type="submit" class="btn btn-logout">Logout</button>
  </form>
</div>
{% endblock %}
