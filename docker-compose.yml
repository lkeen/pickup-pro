services:
  db:
    # PostGIS rather than plain postgres: court search is an ST_DWithin query
    # against a GiST-indexed geography column. The image is postgres:16 with the
    # PostGIS libraries added, so an existing pgdata volume carries over
    # unchanged -- only the extension has to be created, which a migration does.
    image: postgis/postgis:16-3.4
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Backs both the response cache and the rate limiter. In-memory limiter
    # storage is per-process, so it counts wrong the moment there is more than
    # one worker.
    image: redis:7-alpine
    restart: always
    # Bounded memory with LRU eviction: a cache that grows without limit is a
    # memory leak with extra steps.
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
