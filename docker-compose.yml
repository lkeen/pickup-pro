services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reachable by name, not on
      # localhost -- the .env values point at the host's published ports and are
      # correct for running the app outside Docker.
      APP_ENV: production
      # Nothing fronts the app in compose -- the port is published directly --
      # so X-Forwarded-* headers from a client must not be believed.
      TRUSTED_PROXY_HOPS: 0
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migrations run on start rather than at image build: the schema belongs to
    # the database's lifecycle, not the artifact's.
    command: >-
      sh -c "flask db upgrade && exec gunicorn --bind 0.0.0.0:8000
      --workers 3 --threads 2 --timeout 30
      --access-logfile - --error-logfile - wsgi:app"

  db:
    # PostGIS rather than plain postgres: court search is an ST_DWithin query
    # against a GiST-indexed geography column. The image is postgres:16 with the
    # PostGIS libraries added, so an existing pgdata volume carries over
    # unchanged -- only the extension has to be created, which a migration does.
    image: postgis/postgis:16-3.4
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Backs both the response cache and the rate limiter. In-memory limiter
    # storage is per-process, so it counts wrong the moment there is more than
    # one worker.
    image: redis:7-alpine
    restart: always
    # Bounded memory with LRU eviction: a cache that grows without limit is a
    # memory leak with extra steps.
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
