name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  FLASK_APP: manage.py
  POSTGRES_USER: pickup_user
  POSTGRES_PASSWORD: pickup_password
  POSTGRES_DB: pickup_pro

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pickup_user
          POSTGRES_PASSWORD: pickup_password
          POSTGRES_DB: pickup_pro
        ports:
          - 5432:5432
        # Without a healthcheck the first connection races the server's startup.
        options: >-
          --health-cmd "pg_isready -U pickup_user -d pickup_pro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Create the test database
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD createdb -h localhost -U "$POSTGRES_USER" "${POSTGRES_DB}_test"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://pickup_user:pickup_password@localhost:5432/pickup_pro
        run: flask db upgrade

      - name: Check for model/migration drift
        env:
          DATABASE_URL: postgresql+psycopg://pickup_user:pickup_password@localhost:5432/pickup_pro
        # Fails if the models have changed without a matching migration.
        run: flask db check

      - name: Migrations reverse cleanly
        env:
          DATABASE_URL: postgresql+psycopg://pickup_user:pickup_password@localhost:5432/pickup_pro
        # A downgrade path that has never been run is a downgrade path that does
        # not work: this repo shipped one that could not even compile.
        run: |
          flask db downgrade base
          flask db upgrade

      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://pickup_user:pickup_password@localhost:5432/pickup_pro
        run: pytest --cov=app --cov-report=term-missing
